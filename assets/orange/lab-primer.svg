  <linearGradient id="orange" x2=".8" y2="1"><stop stop-color="#ffbe7c" /><stop offset=".45" stop-color="#f47735" /><stop offset="1" stop-color="#b3441b" /></linearGradient>
  <radialGradient id="glow"><stop stop-color="#ffcd8d" stop-opacity=".22" /><stop offset="1" stop-color="#ffcd8d" stop-opacity="0" /></radialGradient>
