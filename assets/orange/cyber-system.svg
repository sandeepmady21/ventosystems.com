<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Understand the environment, define the engagement</title>
<desc id="desc">Conceptual cybersecurity scoping diagram. Applications, a device and data sit within a defined environment. Their connections pass through one access point to a specialist review and a document representing an agreed scope. The diagram explains an introduction and planning process, not a deployed security service or a guarantee of protection.</desc>
