    <form class="card brief-form" id="brief-form" action="mailto:hello@ventosystems.com" method="post" enctype="text/plain">
      <h2>Prepare an enquiry</h2>
      <label for="interest">What are you exploring?</label>
      <select id="interest" name="interest"><option value="choose">Help choosing a delivery model</option><option value="offshore">Offshore engineering team</option><option value="gcc">Global Capability Center</option><option value="transfer">Build–Operate–Transfer</option></select>
      <div class="form-pair"><div><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div><div><label for="company">Organization</label><input id="company" name="company" autocomplete="organization"></div></div>
      <label for="message">What should the team own first?</label>
      <textarea id="message" name="message" rows="5" required placeholder="Share the work, skills and target start."></textarea>
      <button type="submit" class="button">Create email draft <span aria-hidden="true">↗</span></button>
      <p id="draft-status" role="status" aria-live="polite"></p>
      <div id="draft-result" hidden><label for="draft">Your email draft</label><textarea id="draft" rows="7" readonly></textarea><a class="text-link" id="open-draft" href="mailto:hello@ventosystems.com">Open your email app <span aria-hidden="true">↗</span></a></div>
      <noscript><p><a href="mailto:hello@ventosystems.com">Email Vento Systems directly</a></p></noscript>
    </form>
