<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sarath &amp; Associates — sharing card source</title>
    <style>
      @font-face {
        font-family: "Source Serif 4";
        src: url("../assets/fonts/source-serif-4-latin.woff2") format("woff2");
        font-weight: 200 900;
      }
      @font-face {
        font-family: "Source Sans 3";
        src: url("../assets/fonts/source-sans-3-latin.woff2") format("woff2");
        font-weight: 200 900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f8f7f3;
        color: #183c52;
        font-family: "Source Sans 3", sans-serif;
      }
      .brand-band {
        position: absolute;
        left: 62px;
        bottom: 55px;
        width: 104px;
        height: 3px;
        display: grid;
        grid-template-columns: 3fr 2fr;
      }
      .brand-band::before,
      .brand-band::after {
        content: "";
      }
      .brand-band::before {
        background: #239c64;
      }
      .brand-band::after {
        background: #efa36c;
      }
      .copy {
        position: absolute;
        inset: 62px auto 58px 62px;
        width: 625px;
      }
      .brand {
        margin: 0;
        font-size: 25px;
        line-height: 1.25;
        font-weight: 500;
        letter-spacing: 2.2px;
      }
      .description {
        margin: 13px 0 0;
        font-size: 21px;
        letter-spacing: 0.5px;
        color: #526473;
      }
      .rule {
        width: 52px;
        height: 1px;
        background: #195888;
        margin-top: 55px;
      }
      h1 {
        margin: 28px 0 0;
        font:
          400 76px/1.09 "Source Serif 4",
          Georgia,
          serif;
        letter-spacing: -1.5px;
      }
      h1 span {
        display: block;
      }
      h1 em {
        color: #142f43;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 70px;
        font-weight: 400;
        font-style: normal;
      }
      .visual {
        position: absolute;
        top: 34px;
        right: 34px;
        bottom: 34px;
        width: 434px;
      }
      .visual::before {
        content: "";
        position: absolute;
        inset: -13px -13px auto auto;
        width: 125px;
        height: 125px;
        border-top: 1px solid #efa36c;
        border-right: 1px solid #efa36c;
      }
      .visual img {
        border-radius: 2px;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 43%;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Social sharing card">
      <div class="copy">
        <p class="brand">SARATH &amp; ASSOCIATES</p>
        <p class="description">Chartered Accountants · Since 1990</p>
        <div class="rule" aria-hidden="true"></div>
        <h1>
          <span>Perspective</span><span>that goes</span
          ><span><em>beyond numbers.</em></span>
        </h1>
      </div>
      <div class="visual">
        <img
          src="../assets/architecture.jpg"
          alt="An architectural study of sandstone columns and an archway"
        />
      </div>
      <div class="brand-band" aria-hidden="true"></div>
    </main>
  </body>
</html>
