<meta name="robots" content="noindex, nofollow">
<title>Document Chaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">

<style>
/* Four stacked planes: chrome sits above the band, the band above the page,
   cards float on the page. Each is a pastel, each is a step lighter. */
/* THE LEDGER
   Four planes, all drawn from green-ruled account paper rather than from white.
   Rules do the dividing, not gaps. Red is scarce and means arrears, as it does
   in a real ledger. */
:root{
  --chrome:#C5D3C8;  --band:#EDF2EB;  --paper:#F2F5F0;
  --surface:#FFFFFF; --surface-2:#F7FAF6; --surface-3:#E9EFE8;
  --ink:#16211D; --ink-2:#48544E; --ink-3:#5D665F;
  --rule:#D6E0D7; --rule-2:#B7C6B9; --rule-3:#9FB2A2;
  --accent:#16456B; --accent-ink:#FFFFFF; --accent-soft:#E2EBF3; --accent-line:#B2C8DC;
  --ok:#1D6B4C;    --ok-soft:#E2F0E7;     --ok-line:#A9D2BB;
  --warn:#8A5A0F;  --warn-soft:#FAF0DA;   --warn-line:#E2C88E;
  --bad:#A32A1C;   --bad-soft:#FAE6E2;    --bad-line:#E7B4AB;
  --violet:#57458C;--violet-soft:#EFEAF8; --violet-line:#C8BCE6;
  --spine:#8C2B22;   /* the red cloth spine of a bound register */
  /* Already on file is not the same fact as in and checked, so it is not the
     same green. Both are green because both are settled; this one is the
     deeper, older one, because it was in the register before we asked. */
  --filed:#26503C; --filed-soft:#D5E7D9; --filed-line:#A8C6AF;
  --shadow-1:0 1px 1px rgba(22,33,29,.05);
  --shadow-2:0 1px 2px rgba(22,33,29,.06), 0 12px 28px -18px rgba(22,33,29,.28);
  --r:7px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  font-variant-numeric:tabular-nums slashed-zero;
  font-feature-settings:"zero" 1;
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- chrome ---------- */
.top{padding:14px 0 14px 0;background:var(--chrome);border-left:3px solid var(--spine)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-size:12.5px}
.brand span::before{content:"";display:inline-block;width:1px;height:11px;background:var(--rule-2);margin-right:10px;vertical-align:-1px}
.note{
  background:rgba(255,255,255,.5);
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  border:1px dashed var(--rule-2);padding:4px 9px;border-radius:5px;
}
.tabs{background:var(--chrome);border-bottom:1px solid var(--rule)}
.tabs .frame{gap:5px;flex-wrap:nowrap;overflow-x:auto;align-items:flex-end}
.tab{
  background:transparent;border:1px solid transparent;border-bottom:0;border-top:2px solid transparent;
  border-radius:8px 8px 0 0;padding:8px 16px 10px;margin-bottom:-1px;
  color:var(--ink-2);font-weight:500;white-space:nowrap;font-size:13.5px;
}
.tab:hover:not([aria-selected="true"]){background:rgba(255,255,255,.4);color:var(--ink)}
.tab small{color:var(--ink-2);opacity:.75}
.tab[aria-selected="true"]{
  background:var(--band);border-color:var(--rule-2);border-top-color:var(--accent);
  color:var(--accent);font-weight:600;
}
.tab[aria-selected="true"] small{color:var(--accent);opacity:.8}
.tab small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.tab[aria-selected="true"] small{color:var(--accent)}
.frame{max-width:1180px;margin-inline:auto;padding-inline:22px;width:100%;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
main{padding:22px 0;max-width:1180px;margin:0 auto;padding-inline:22px}
.typebar[hidden] + main{border-top:1px solid var(--band)}
.panel[hidden]{display:none}

/* ---------- shared bits ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow-1)}
.pad{padding:16px 18px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
h2{font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;margin:0;letter-spacing:-.005em}
.sub{color:var(--ink-2);font-size:13px;margin:0}
.chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);
  background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;
}
.chip.ok,.chip.warn,.chip.bad,.chip.violet,.chip.acc{
  border-radius:3px;padding:2px 7px;font-size:10.5px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;border-width:1px;
}
.chip.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.chip.filed{background:var(--filed-soft);border-color:var(--filed-line);color:var(--filed)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.chip.violet{background:var(--violet-soft);border-color:var(--violet-line);color:var(--violet)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.affd{
  text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:400;
  margin-left:7px;padding-left:7px;border-left:1px solid currentColor;opacity:.72;
}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule-2);background:var(--surface);
  color:var(--ink);border-radius:7px;padding:7px 13px;font-weight:500;font-size:13px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.quiet{border-color:transparent;background:none;color:var(--accent);padding:7px 8px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.locked{background:var(--surface-2);color:var(--ink-3);border-style:dashed;cursor:help}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- checklist ---------- */
.head-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.head-strip h2{margin-right:2px}
.duebtn{border:1px dashed var(--rule-2);background:var(--surface-2);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--ink-2)}
.duebtn:hover{border-color:var(--accent);color:var(--accent)}
.banner{
  display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:var(--r);padding:13px 15px;
}
.banner .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.presets{display:flex;gap:7px;flex-wrap:wrap}
.toggle{
  border:1px solid var(--rule-2);background:var(--surface);border-radius:5px;
  padding:6px 12px;font-size:12.5px;color:var(--ink-2);font-weight:500;
}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sect{border-top:1px solid var(--accent-line);padding-top:11px;margin-top:4px}
.sect:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sect-h{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin-bottom:6px;padding-bottom:5px;border-bottom:2px solid var(--rule-3);
}
.sect-h h3{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;color:var(--ink-2)}
.items{display:flex;flex-direction:column}
.items{border-top:1px solid var(--rule)}
.item{
  display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;
  padding:10px 8px;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;
}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item.off{opacity:.5}
.item.off .iname{text-decoration:line-through}
.item.have{background:var(--filed-soft);border-left-color:var(--filed)}
.item.have:hover{background:var(--filed-soft)}
.item.locked{background:var(--surface-2);border-left-color:var(--rule-3)}
.box{
  width:18px;height:18px;margin-top:2px;border:1.5px solid var(--rule-2);border-radius:4px;
  background:var(--surface);display:grid;place-items:center;flex:none;padding:0;
}
.box[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.box[aria-checked="true"]::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(42deg) translate(-1px,-1px)}
.box[disabled]{background:var(--surface-3);border-style:dashed;cursor:not-allowed}
.iname{font-weight:500;letter-spacing:-.004em}
.ialias{color:var(--ink-3);font-size:12.25px;margin-top:2px;padding-left:9px;border-left:1px solid var(--rule-2)}
.imeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.need{
  border:1px solid var(--rule-2);background:var(--surface);border-radius:5px;
  font-size:11.5px;padding:2px 6px;color:var(--ink-2);font-family:inherit;
}
.foot{
  position:sticky;bottom:0;margin-top:16px;background:var(--band);
  border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow-2);
}
.counts{display:flex;gap:18px;flex-wrap:wrap}
.counts b{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;display:block;line-height:1.15;color:var(--ink)}
.counts span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}

/* ---------- chase board ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pipe{display:flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden;background:var(--surface);margin-bottom:4px}
.pipe button{flex:1;min-width:0;border:0;border-right:1px solid var(--rule);background:none;padding:9px 10px;text-align:left;line-height:1.25}
.pipe button:last-child{border-right:0}
.pipe button:hover:not([aria-pressed="true"]){background:var(--surface-2)}
.pipe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pipe .pn{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;line-height:1}
.pipe .pl{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe button[aria-pressed="true"] .pl{color:var(--accent-ink);opacity:.85}
.pipe .seam{border-right:2px solid var(--accent)}
.pipe button.empty .pn{color:var(--ink-3);opacity:.5}
.sides{display:flex;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.filters .toggle{padding:6px 12px}
.filters .toggle b{font-family:"IBM Plex Mono",monospace;font-weight:500;opacity:.75;margin-left:3px}
.brow{border-bottom:1px solid var(--rule);padding:11px 16px 11px 14px;border-left:3px solid transparent}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--surface-2)}
.brow{cursor:pointer}
.brow.open{background:var(--accent-soft);border-left-color:var(--accent)}
.ditem{border-left:3px solid transparent}
.drawer .eyebrow,.drawer .row-between{padding:9px 11px;border-bottom:1px solid var(--rule-2);background:var(--band)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.legend .lg{font-family:"IBM Plex Mono",monospace;font-weight:500;margin-right:3px;
  padding:1px 5px;border-radius:3px;border:1px solid}
.lg.pending{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.lg.review{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.lg.accepted{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.lg.filed{color:var(--filed);background:var(--filed-soft);border-color:var(--filed-line)}
.ditem.pending{background:var(--warn-soft);border-left-color:var(--warn)}
.ditem.onfile{background:var(--filed-soft);border-left-color:var(--filed)}
.ditem.onfile .dname{color:var(--filed)}
.ditem.accepted{background:var(--surface-2);border-left-color:var(--rule-2)}
.ditem.review{background:var(--accent-soft);border-left-color:var(--accent)}
.ditem.review .dname{color:var(--accent)}
.ditem.waived{background:var(--surface-2);border-left-color:var(--rule-3);opacity:.72}
.ditem .dname{font-weight:500}
.ditem.pending .dname{color:var(--warn)}
.bmain{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.bname{font-weight:500;letter-spacing:-.004em}
.bsub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.od{color:var(--bad);font-weight:500}
.soft{color:var(--ink-3);font-size:11.5px;margin-left:6px}
.bar{height:5px;background:var(--surface-3);border-radius:0;overflow:hidden;margin:8px 0 6px;max-width:300px;border:1px solid var(--rule-2)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:0}
.bmiss{font-size:12.5px;color:var(--ink-2)}
.bmiss b{font-weight:500;color:var(--ink)}
.bacts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.drawer{background:var(--surface);border:1px solid var(--rule-2);border-radius:5px;margin-top:11px;padding:0;display:block}
.ditem{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:7px 11px;border-bottom:1px solid var(--rule);font-size:13px;
}
.ditem:last-child{border-bottom:0}
.empty{text-align:center;padding:46px 20px;color:var(--ink-2)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}

/* ---------- client page ---------- */
.split{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.phone{
  width:390px;max-width:100%;border:10px solid #20282B;border-radius:32px;background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow-2);
}
.phead{background:var(--band);border-bottom:1px solid var(--rule);padding:13px 15px}
.pbody{height:600px;overflow-y:auto;padding:15px}
.firmline{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;flex:none;font-size:13px}
.pbar{height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:11px 0 6px}
.pbar{display:flex}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px 0 0 99px}
.pbar u{display:block;height:100%;background:var(--warn-line)}
.ccard{border:1px solid var(--rule);border-radius:9px;padding:12px;margin-bottom:9px;background:var(--surface)}
.ccard.done{background:var(--ok-soft);border-color:var(--ok-line)}
.ccard.answered{background:var(--warn-soft);border-color:var(--warn-line)}
.ccard.redo{background:var(--bad-soft);border-color:var(--bad-line)}
.ccard.confused{background:var(--violet-soft);border-color:var(--violet-line)}
.cname{font-weight:500;font-size:13.5px}
.chint{color:var(--ink-3);font-size:12px;margin-top:2px}
.cbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.cbtn{flex:1;min-width:120px;justify-content:center;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:9px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.cbtn:hover{background:var(--accent);color:var(--accent-ink)}
.cbtn.plain{border-color:var(--rule-2);background:none;color:var(--ink-3);flex:0 0 auto;min-width:0;font-weight:400;font-size:12.5px;padding:9px 11px}
.cbtn.plain:hover{background:var(--surface-2);color:var(--ink)}
.parts{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.part{border:1px solid var(--rule-2);border-radius:5px;padding:7px 10px;min-width:44px;font-size:11.5px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;background:var(--surface)}
.part:hover{border-color:var(--accent);color:var(--accent)}
.part.on{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pfoot{border-top:1px solid var(--rule);padding:12px 15px;background:var(--band)}
.gate{width:100%;justify-content:center;padding:12px;border-radius:8px;font-weight:500;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.gate.live{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gate:hover{filter:brightness(1.06)}
.statebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mini{border:1px solid var(--rule);border-left:3px solid var(--ink-3);border-radius:7px;padding:11px 13px;background:var(--surface-2)}
.mini.blocked{border-left-color:var(--bad)}
.mini.clear{border-left-color:var(--ok)}

/* ---------- overlays ---------- */
#modal{position:fixed;inset:0;background:rgba(12,18,16,.5);display:grid;place-items:center;padding:20px;z-index:70}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:13px;box-shadow:var(--shadow-2);max-width:520px;width:100%;max-height:86vh;overflow:auto}
.sheet header{padding:15px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .body{padding:18px}
.sheet footer{padding:13px 18px;border-top:1px solid var(--rule);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 13px 13px}
.wa{background:#E7F0E4;border:1px solid #C6D9C0;border-radius:9px;padding:13px;color:#14261B;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--rule-2);background:var(--surface);border-radius:9px;padding:13px;margin-bottom:9px}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-weight:500}
.opt span{font-size:12.5px;color:var(--ink-3)}
.opt.friendly{border-color:var(--violet-line);background:var(--violet-soft)}
.opt.friendly b{color:var(--violet)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:6px 0;border-bottom:1px solid var(--rule)}
.tbl td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace}
.tbl tr:last-child td{border-bottom:0}

/* ---------- search + clients ---------- */
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--rule-2);background:var(--surface-2);
  border-radius:7px;padding:7px 11px;font:inherit;font-size:13px;color:var(--ink);
}
.search::placeholder{color:var(--ink-3)}
.search:focus{background:var(--surface);border-color:var(--accent);outline:none}
.search{background:rgba(255,255,255,.62);border-color:rgba(255,255,255,.9)}
.sresults{
  position:absolute;top:100%;left:0;right:0;margin-top:5px;background:var(--surface);
  border:1px solid var(--rule-2);border-radius:8px;box-shadow:var(--shadow-2);z-index:50;overflow:hidden;
}
.sbox{position:relative;flex:1;max-width:340px;display:flex}
.sresults button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--rule)}
.sresults button:last-child{border-bottom:0}
.sresults button:hover{background:var(--accent-soft)}
.sresults .m{font-size:12px;color:var(--ink-3);margin-top:1px}
.ctable{width:100%;border-collapse:collapse}
.ctable th{
  background:var(--band);text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--rule);
}
.ctable th:first-child{border-radius:6px 0 0 6px}
.ctable th:last-child{border-radius:0 6px 6px 0}
.ctable td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.ctable tr:last-child td{border-bottom:0}
.ctable tbody tr{cursor:pointer}
.ctable tbody tr:hover{background:var(--band)}
.ctable .nm{font-weight:500}
.ctable .sm2{font-size:12px;color:var(--ink-3);margin-top:1px}
.ids{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);line-height:1.7;word-spacing:.3em}
.live{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.none{color:var(--ink-3);font-size:12.5px}
.back{border:0;background:none;color:var(--accent);padding:0;font-size:13px;font-weight:500}
.back:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500}
.person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;background:var(--surface-2);border-radius:7px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:7px 0 14px}
.tile{
  border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;padding:11px 12px;text-align:left;
}
.tile:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.tile b{display:block;font-weight:500;font-size:13px;letter-spacing:-.004em}
.tile span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;font-family:"IBM Plex Mono",monospace}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tile[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.tile[disabled]{opacity:.55;border-style:dashed;cursor:not-allowed}
.grouplbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:12px 0 0}
.prov{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.prov b{color:var(--ink-2);font-weight:500}

/* ---------- demo-only controls, never part of the product ---------- */
.demobar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px dashed var(--rule-2);border-radius:8px;padding:8px 11px;background:var(--band);
}
.demobar .tag{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
  border:1px solid var(--rule-2);border-radius:4px;padding:2px 6px;background:var(--surface);flex:none;
}
.demobar .lbl{font-size:12.5px;color:var(--ink-3);flex:none}
.demobar .opts{display:flex;gap:4px;flex-wrap:wrap}
.demobar button{
  border:1px solid transparent;background:none;border-radius:5px;padding:4px 9px;
  font-size:12.5px;color:var(--ink-2);
}
.demobar button:hover{background:var(--surface-3);color:var(--ink)}
.demobar button[aria-pressed="true"]{background:var(--surface);border-color:var(--rule-2);color:var(--ink);font-weight:500}
.tickhint{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}

/* ---------- persistent engagement-type strip ---------- */
.typebar{background:var(--band);border-bottom:1px solid var(--rule)}
.typebar[hidden]{display:none}
.typebar .inner{
  max-width:1180px;margin:0 auto;padding:14px 22px;
  display:flex;align-items:flex-start;gap:30px;flex-wrap:wrap;
}
.tgroup{display:flex;flex-direction:column;gap:8px;min-width:0}
.glabel{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.trow{display:flex;gap:7px;flex-wrap:wrap}
.tpill{
  border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;
  padding:9px 14px;min-width:138px;white-space:nowrap;text-align:left;line-height:1.3;
}
.tpill b{display:block;font-weight:500;font-size:13.5px;letter-spacing:-.004em}
.tpill span{display:block;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;margin-top:2px}
/* hover only applies to UNSELECTED tiles — on a selected one it repainted the text
   in the same blue as its own background and the label vanished */
.tpill:not([aria-pressed="true"]):not([disabled]):hover{border-color:var(--accent);color:var(--accent)}
.tpill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tpill[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.tpill[aria-pressed="true"]:hover{filter:brightness(1.12)}
.tpill[disabled]{opacity:.45;border-style:dashed;cursor:not-allowed}

   whole point of having three necessity levels. */
const rowBlocking = r => rowLedger(r).filter(d => d.state === "pending" && d.need === "Required").length;
const rowDocs  = r => (DOCS[r.et] || DOCS.tax_audit).items.filter(i => i.on);
const rowTotal = r => rowDocs(r).length;
const rowDone  = r => rowTotal(r) - r.missIds.length;

/* every document in this engagement, with the state the firm sees */
/* Five real states, not three derived ones. "received" is the one that was
   missing: a document can be in and still not checked, which is the whole
   review queue the board already claimed to have. */
function itemState(r, i){
  if(r.states && r.states[i.id]) return r.states[i.id];
  return r.missIds.includes(i.id) ? "pending" : (i.have ? "onfile" : "accepted");
}
function rowLedger(r){
  return rowDocs(r).map(i => ({
    id: i.id, name: i.name, state: itemState(r, i),
    note: (r.notes && r.notes[i.id]) || i.have || "", need: i.need,
  }));
}
function setItemState(id, itemId, st, note){
  const r = board.find(x => x.id === id);
  r.states = r.states || {}; r.notes = r.notes || {};
  r.states[itemId] = st;
  if(note) r.notes[itemId] = note;
  if(st === "pending"){ if(!r.missIds.includes(itemId)) r.missIds.push(itemId); }
  else r.missIds = r.missIds.filter(x => x !== itemId);
  closeModal(); drawBoard(); drawTypeBar();
}
const reviewCount = r => rowLedger(r).filter(d => d.state === "received").length;
const needsReview = r => reviewCount(r) > 0;
/* Three of the filter tags are facts about the ledger, not narrative, so they
   are computed. The rest describe what a human observed and stay as data. */
/* THE PIPELINE.
   A row sits in exactly one stage, and the stage is derived wherever it can be.
   Left of the seam the client owes the next move; right of it, a person here does. */
const STAGES = [
  {id:"notstarted", label:"Not started",   side:"client"},
  {id:"chasing",    label:"Chasing",       side:"client"},
  {id:"review",     label:"To review",     side:"firm"},
  {id:"ready",      label:"Ready to start",side:"firm"},
  {id:"preparing",  label:"Being prepared",side:"firm"},
  {id:"partner",    label:"With the partner", side:"firm"},
  {id:"filed",      label:"Filed",         side:"firm"},
];
function stageOf(r){
  if(r.stage) return r.stage;                  // set by a handover, never guessed
  if(needsReview(r))       return "review";
  if(rowBlocking(r) > 0)   return "chasing";
  return "ready";
}
/* Diagnoses explain why a row is stuck. They only exist where they can apply,
   which is what stops fifteen chips sitting in one row. */
const DIAGNOSES = {
  chasing:   [{id:"promised",label:"Said they'd send it, didn't"},
              {id:"oneleft", label:"One item left"},
              {id:"stuck",   label:"Opened but stuck"},
              {id:"confused",label:"Confused, call them"},
              {id:"never",   label:"Never opened the link"}],
  ready:     [{id:"idle", label:"Untouched 5 days or more"}],
  preparing: [{id:"idle", label:"Untouched 5 days or more"}],
  partner:   [{id:"idle", label:"Untouched 5 days or more"}],
};
const hasTag = (r, t) =>
    t === "oneleft" ? r.missIds.length === 1
  : t === "ready"   ? r.missIds.length === 0
  : t === "review"  ? needsReview(r)
  : t === "idle"    ? (r.idle || 0) >= 5
  : r.tags.includes(t);

const scoped = () => board
  .filter(r => activeType === "all" || r.et === activeType)
  .filter(r => ownerFilter === "all" || r.owner === ownerFilter);
function setOwnerFilter(v){ ownerFilter = v; openRow = null; drawBoard(); }
/* clients with no engagement of the chosen type — the set the board cannot
   otherwise show, because its rows ARE engagements */
const activeName = () => activeType === "all"
  ? "engagement"
  : (ENGAGEMENT_TYPES.find(t => t.id === activeType) || {name:"engagement"}).name;
function notStarted(){
  if(activeType === "all") return [];
  return CLIENTS.filter(c => !board.some(r => r.name === c.name && r.et === activeType));
}
function count(f){ const b = scoped().filter(inStage);
  return f === "all" ? b.length : b.filter(r => hasTag(r, f)).length; }
function inStage(r){ return stageOf(r) === stage; }
function rows(){
  if(stage === "notstarted") return [];
  const b = scoped().filter(inStage);
  return filter === "all" ? b : b.filter(r => hasTag(r, filter));
}
function stageCount(id){
  if(id === "notstarted") return notStarted().length;
  return scoped().filter(r => stageOf(r) === id).length;
}
function setStage(id){ stage = id; filter = "all"; openRow = null; drawBoard(); }

function drawBoard(){
  const list = rows();
  const outstanding = scoped().filter(r => r.missIds.length).length;
  const ready = scoped().filter(r => !r.missIds.length).length;
  const tname = activeType === "all" ? "Tax audit and GST" : ENGAGEMENT_TYPES.find(t => t.id === activeType).name;

  let html = `
  <div class="stack">
    <div class="row-between">
      <div>
        <h2>${esc(tname)}</h2>
        <p class="sub">${activeType==="all" ? "Mixed deadlines" : inByLine(activeType)} &middot; ${scoped().length} clients &middot; <b>${outstanding}</b> still owe documents &middot; ${ready} ready to start</p>
      </div>
      <div class="inline">
        <button class="btn" onclick="editTurnaround()">How long we need</button>
        <button class="btn" onclick="editDue()">Deadline moved?</button>
        <button class="btn primary" onclick="bulk()">Remind all ${outstanding}</button>
      </div>
    </div>

    <div>
      <div class="sides">
        <span style="flex:0 0 28.57%">Waiting on the client</span>
        <span>Waiting on us</span>
      </div>
      <div class="pipe">
        ${STAGES.map((st,k) => {
          const n = stageCount(st.id);
          return `<button aria-pressed="${stage===st.id}" class="${n?"":"empty"}${k===1?" seam":""}" onclick="setStage('${st.id}')">

          <option value="all" ${ownerFilter==="all"?"selected":""}>Everyone</option>

            <div>

            </div>
          </div></div>`;
      });
    }
  } else if(!list.length){
    html += `<div class="empty"><b>Nothing here.</b>No engagement is at this stage right now.</div>`;
  }

  list.forEach(r => {
    const total = rowTotal(r), got = rowDone(r), missNames = rowMiss(r);
    const pct = Math.round(got / total * 100);
    const blocking = rowBlocking(r);
    const done = blocking === 0;
    const opened = openRow === r.id;
    html += `<div class="brow ${opened?"open":""}" onclick="toggleRow(${r.id})">
      <div class="bmain">
        <div>
          <div class="bname">${esc(r.name)}</div>

              : r.chased ? `<span class="chip">Chased ${r.chased} time${r.chased===1?"":"s"} &middot; last ${r.since===0?"today":(r.since||r.chased)+" days ago"}</span>` : ""}

            ${r.stuck ? `<span class="chip bad">${esc(r.stuck)}</span>` : ""}

            ${r.never ? `<span class="chip bad">Link never opened</span>` : ""}

            : `<button class="btn sm" onclick="confirmChase(${r.id})">Send reminder</button>`}
          ${done
            ? `<button class="btn sm primary" onclick="handover(${r.id})">Start work</button>`
            : `<button class="btn sm locked" onclick="why(${r.id})">Start work</button>`}
        </div>
      </div>`;

    if(opened){
      const led = rowLedger(r);
      const n = k => led.filter(x => x.state === k).length;
      html += `<div class="drawer" onclick="event.stopPropagation()">
        <div class="row-between" style="margin-bottom:4px">
          <span class="eyebrow">Everything we asked ${esc(r.name.split(" ")[0])} for</span>

        } else if(d.state === "waived"){

  });

  html += `</div></div>`;
  $("#p-board").innerHTML = html;
}

/* =======================================================================
   SCREEN 3 — THE CLIENT'S PAGE
   ======================================================================= */
const STATES = [
  {id:"empty",    label:"Just opened the link"},
  {id:"partial",  label:"Halfway through"},
  {id:"answered", label:"Every item answered"},
  {id:"complete", label:"All accepted"},
];

function applyState(st){
  cstate = st;
  buildCards();
  const n = cards.length, fill = c => { if(c.parts) c.got = c.parts.slice(); c.st = "done"; };

  if(st === "empty") { /* everything left pending */ }

  if(st === "partial"){
    cards.slice(0, Math.floor(n * 0.4)).forEach(fill);
    const part = cards.find(c => c.parts && c.st === "done");
    if(part){ part.got = part.parts.filter((_,k) => k !== 4 && k !== 7); part.st = "pending"; }
    const redo = cards.find(c => c.st === "pending" && !c.parts);
    if(redo){ redo.st = "redo"; redo.why = "Page 2 was cut off. Just that one page again, please."; }
  }

  if(st === "answered"){
    cards.forEach(fill);
    const pick = k => cards[Math.min(k, n - 1)];
    if(n > 3) pick(n-1).st = "promised";
    if(n > 4) pick(n-2).st = "na";
    if(n > 5) pick(n-3).st = "thirdparty";
    if(n > 6) pick(n-4).st = "confused";
  }

  if(st === "complete") cards.forEach(fill);

  drawClient();
}

function pending(){ return cards.filter(c => c.st === "pending" || c.st === "redo").length; }
function accepted(){ return cards.filter(c => c.st === "done").length; }
function allAnswered(){ return pending() === 0; }
/* "na" comes straight from the client with no approval. If it opened this
   gate, the two-gate design would be a fiction. */
function firmClear(){ return cards.every(c => c.st === "done"); }

function cardLook(c){
  if(c.st === "done")       return ["done",      `<span class="chip ok">Done ✓</span>`];
  if(c.st === "redo")       return ["redo",      `<span class="chip bad">Please send again</span>`];
  if(c.st === "promised")   return ["answered",  `<span class="chip warn">You said Tuesday</span>`];
  if(c.st === "na")         return ["answered",  `<span class="chip warn">Doesn't apply, ${esc(CC().owner.split(" ")[0])} is checking</span>`];
  if(c.st === "thirdparty") return ["answered",  `<span class="chip warn">Your bank has it</span>`];
  if(c.st === "confused")   return ["confused",  `<span class="chip violet">${esc(CC().owner.split(" ")[0])} will call you today</span>`];
  return ["", `<span class="chip">Not sent yet</span>`];
}

  $("#p-client").innerHTML = `

                <div style="font-weight:500;font-size:13px">${esc(CLIENT.staff)}</div>
                <div class="chint">${esc(FIRM)}</div>
              </div>
            </div>
            <div class="inline" style="gap:5px">

function uploadPart(id, part){
  const c = cards.find(x => x.id === id);
  if(c.got.includes(part)) return;
  c.got.push(part);
  if(c.got.length === c.parts.length) c.st = "done";
  drawClient();
}
function upload(id){
  const c = cards.find(x => x.id === id);
  if(c.parts){
    const miss = c.parts.filter(p => !c.got.includes(p));
    if(miss.length){
      c.got.push(miss[0]);
      if(!c.parts.filter(p => !c.got.includes(p)).length) c.st = "done";
      drawClient();
      toast(`${miss[0]} statement uploaded. ${c.parts.length - c.got.length} month${c.parts.length-c.got.length===1?"":"s"} left.`);
      return;
    }
  }
  const was = c.st;
  c.st = "done"; drawClient();
  toast(`“${esc(c.name)}” uploaded and saved.`, () => { c.st = was; drawClient(); });
}

const TURNAROUND = {tax_audit:8, stat_audit:10, llp_audit:6, trust_audit:8,
                    society_audit:6, gst_monthly:2, gstr9:10, form15cb:1, networth:2};

                 trust_audit:"2026-09-30", society_audit:"2026-07-31", gst_monthly:"2026-09-11",
                 gstr9:"2026-12-31"};
const TODAY = new Date(2026, 8, 12);
const MONTHS_LONG = ["January","February","March","April","May","June","July",
                     "August","September","October","November","December"];
const fmtDate = d => `${d.getDate()} ${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`;

function inByFor(typeId){
  const iso = DUE_ISO[typeId];
  if(!iso) return null;
  const d = new Date(iso + "T00:00:00");
  let left = TURNAROUND[typeId] || 0;
  while(left > 0){ d.setDate(d.getDate() - 1); if(d.getDay() !== 0) left--; }
  return d;
}
const daysFromToday = d => Math.round((d - TODAY) / 86400000);
function inByLabel(typeId){
  const d = inByFor(typeId || currentType);
  return d ? fmtDate(d) : (ENGAGEMENT_TYPES.find(t => t.id === (typeId||currentType))||{}).due;
}

    ${c.onfile.length ? `<div class="card pad">
      <div class="eyebrow" style="margin-bottom:8px">Already on file</div>
      ${c.onfile.map(o => `<p class="sub" style="margin-bottom:5px"><span class="chip ok">Have it</span> ${esc(o)}</p>`).join("")}
      <p class="sub" style="font-size:12.5px;margin-top:8px">Answers &ldquo;have we already got this?&rdquo; without opening an engagement. It is what stops the same document being asked for three times.</p>
    </div>` : ""}
  </div>`;
}

/* =======================================================================
   START AN ENGAGEMENT  —  the tiles
   ======================================================================= */
let typeChosen  = true;   // false = the picker owns the screen
let engagementSent = false;   // true once the client has the link
let pickerOpen  = false;
let savedAt = null;
function saveDraft(){ savedAt = "14:32"; drawList(); }

function startFor(clientId){
  const c = clientId ? CLIENTS.find(x => x.id === clientId) : null;
  typeChosen = false; pickerOpen = false; engagementSent = false;
  openClientId = null;
  drawList(); go("list");
  if(c) toast(`Starting something for ${esc(c.name)}. Pick what you are doing.`);
}

function openPicker(){
  if(engagementSent){
    modal("The client already has this link",
      `<p class="sub">You cannot switch this engagement to a different type now. Sharma-ji has the link and two documents are already in.</p>
       <p class="sub" style="margin-top:11px">Cancel this engagement and start a new one instead. Anything already received stays on file, and the new checklist will show it as already satisfied rather than asking again.</p>`,
      `<button class="btn" onclick="closeModal()">Leave it as it is</button>
       <button class="btn primary" onclick="closeModal();startFor()">Cancel and start again</button>`);
    return;
  }
  pickerOpen = true; drawList();
}

function chooseType(id){
  if(!loadType(id)) return;
  activeType = id; typeChosen = true; pickerOpen = false; engagementSent = false;
  drawTypeBar(); drawList(); drawBoard(); drawClients();
}

let activeType = "all";   // the global "what am I working in" context

function typeCounts(id){
  const rows = id === "all" ? board : board.filter(r => r.et === id);
  return rows.filter(r => r.missIds.length).length;
}

function drawTypeBar(){
  const live = new Set(board.map(r => r.et));
  const pill = (id, name, sub, dis) =>
    `<button class="tpill" aria-pressed="${activeType===id}" ${dis?`disabled title="${esc(dis)}"`:`onclick="setActiveType('${id}')"`}>
       <b>${esc(name)}</b><span>${esc(sub)}</span></button>`;

  const group = (label, tiles) => tiles.trim()
    ? `<div class="tgroup"><span class="glabel">${esc(label)}</span><div class="trow">${tiles}</div></div>` : "";

  const tilesFor = g => ENGAGEMENT_TYPES.filter(t => t.group === g).map(t =>
    pill(t.id, t.name,
         t.disabled ? t.disabled : (live.has(t.id) ? `${typeCounts(t.id)} owing · in by ${inByFor(t.id) ? fmtDate(inByFor(t.id)).replace(/ \d{4}$/,'') : '—'}` : `${t.items} items`),
         t.disabled || "")
  ).join("");

  $("#typebar").innerHTML = `<div class="inner">`
    + group("Everything", pill("all","All engagements",`${typeCounts("all")} owing`))
    + group("Audit",         tilesFor("Audit"))
    + group("Compliance",    tilesFor("Compliance"))
    + group("Certification", tilesFor("Certification"))
    + `</div>`;
}

function setActiveType(id){
  activeType = id;
  if(id !== "all" && loadType(id)) typeChosen = true;
  filter = "all"; cfilter = "all"; openRow = null; pickerOpen = false;
  drawTypeBar(); drawClients(); drawList(); drawBoard();
  const n = typeCounts(id);
  toast(id === "all"
    ? "Showing every engagement."
    : `${esc(ENGAGEMENT_TYPES.find(x=>x.id===id).name)} — ${n} client${n===1?"":"s"} still owing documents.`);
}

function pickerHTML(switching){
  const groups = ["Audit","Compliance","Certification"];
  return `<div class="card pad">
    <div class="row-between" style="margin-bottom:4px">
      <div>
        <h3>${switching ? "Change what this engagement is" : `What are you doing for ${esc(CC().name)}?`}</h3>
        <p class="sub" style="margin-top:3px">${switching
          ? "Nothing has been sent yet, so this is free. The list and the questions underneath both change."
          : "Pick one. The document list writes itself, and you edit it underneath."}</p>
      </div>
      ${switching ? `<button class="btn sm" onclick="pickerOpen=false;drawList()">Keep ${esc(ET().name)}</button>` : ""}
    </div>
    ${groups.map(g => `<p class="grouplbl">${g}</p>
      <div class="tiles">${ENGAGEMENT_TYPES.filter(t => t.group===g).map(t =>
        t.disabled
          ? `<button class="tile" disabled><b>${esc(t.name)}</b><span>${esc(t.disabled)}</span></button>`
          : `<button class="tile" aria-pressed="${typeChosen && currentType===t.id}" onclick="chooseType('${t.id}')">
               <b>${esc(t.name)}</b><span>${typeChosen && currentType===t.id ? "current" : t.items + " items"}</span></button>`
      ).join("")}</div>`).join("")}
    <p class="sub" style="font-size:12.5px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)">
      <b>No internal audit here, deliberately.</b> Its scope is set per engagement by the board, and the real requests only exist once you have picked a sample. There is nothing to pre-tick, so it needs a running request log rather than a checklist.</p>
  </div>`;
}

/* type-ahead over the whole book of business */
function search(q){
  const box = $("#sres");
  q = q.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML = ""; return; }
  const hits = CLIENTS.filter(c =>
    (c.name+" "+c.pan+" "+c.gstin+" "+c.people.map(p=>p.n+" "+p.p).join(" ")).toLowerCase().includes(q)
  ).slice(0,8);
  box.innerHTML = hits.length
    ? `<div class="sresults">${hits.map(c => `<button onclick="openClient(${c.id});document.getElementById('q').value='';search('')">
         <b style="font-weight:500">${esc(c.name)}</b><div class="m">${esc(c.con)} &middot; ${esc(c.pan)} &middot; ${c.live.length?c.live.length+" live":"nothing started"}</div></button>`).join("")}</div>`
    : `<div class="sresults"><button onclick="document.getElementById('q').value='';search('')"><b style="font-weight:500">No client matches &ldquo;${esc(q)}&rdquo;</b><div class="m">Try a PAN, a GSTIN or a phone number</div></button></div>`;
}
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement.id !== "q"){ e.preventDefault(); $("#q").focus(); }
});


drawTypeBar(); drawClients(); drawList(); drawBoard(); applyState("partial"); go("board");
</script>
