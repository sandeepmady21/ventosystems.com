<meta name="robots" content="noindex, nofollow">
<title>Document Chaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Devanagari:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">

<style>
:root{
  --paper:#F1F2F0; --surface:#FFFFFF; --surface-2:#F7F8F6; --surface-3:#EBEDEA;
  --ink:#151B19; --ink-2:#4A5450; --ink-3:#79837E;
  --rule:#DDE2DE; --rule-2:#C6CDC7;
  --accent:#15456E; --accent-ink:#FFFFFF; --accent-soft:#E3EDF5; --accent-line:#B6CCE0;
  --ok:#1B6B4A;   --ok-soft:#E1F0E8;  --ok-line:#AFD6C3;
  --warn:#8F5E10; --warn-soft:#F7EEDC; --warn-line:#E0C58C;
  --bad:#A32C1F;  --bad-soft:#F8E5E2;  --bad-line:#E4B3AB;
  --violet:#57458C; --violet-soft:#ECE8F7; --violet-line:#C3B7E2;
  --shadow-1:0 1px 2px rgba(20,28,25,.07);
  --shadow-2:0 2px 6px rgba(20,28,25,.07), 0 14px 32px -18px rgba(20,28,25,.35);
  --r:9px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.dev{font-family:"IBM Plex Sans Devanagari","IBM Plex Sans",sans-serif}

/* ---------- chrome ---------- */
.top{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--rule);
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-size:12.5px}
.brand span::before{content:"";display:inline-block;width:1px;height:11px;background:var(--rule-2);margin-right:10px;vertical-align:-1px}
.note{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  border:1px dashed var(--rule-2);padding:4px 9px;border-radius:5px;
}
.tabs{display:flex;gap:2px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 15px;color:var(--ink-2);font-weight:500;white-space:nowrap;font-size:13.5px;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab small{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.tab[aria-selected="true"] small{color:var(--accent)}
main{padding:22px;max-width:1180px;margin:0 auto}
.panel[hidden]{display:none}

/* ---------- shared bits ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow-1)}
.pad{padding:16px 18px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
h2{font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;margin:0;letter-spacing:-.005em}
.sub{color:var(--ink-2);font-size:13px;margin:0}
.chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);
  background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;
}
.chip.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.chip.violet{background:var(--violet-soft);border-color:var(--violet-line);color:var(--violet)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule-2);background:var(--surface);
  color:var(--ink);border-radius:7px;padding:7px 13px;font-weight:500;font-size:13px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.quiet{border-color:transparent;background:none;color:var(--accent);padding:7px 8px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.locked{background:var(--surface-2);color:var(--ink-3);border-style:dashed;cursor:help}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- checklist ---------- */
.head-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.head-strip h2{margin-right:2px}
.duebtn{border:1px dashed var(--rule-2);background:var(--surface-2);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--ink-2)}
.duebtn:hover{border-color:var(--accent);color:var(--accent)}
.banner{
  display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:var(--r);padding:13px 15px;
}
.banner .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.presets{display:flex;gap:7px;flex-wrap:wrap}
.toggle{
  border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;
  padding:6px 13px;font-size:12.5px;color:var(--ink-2);font-weight:500;
}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sect{border-top:1px solid var(--rule);padding-top:11px;margin-top:4px}
.sect:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
.items{display:flex;flex-direction:column}
.item{
  display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;
  padding:9px 8px;border-radius:7px;border:1px solid transparent;
}
.item:hover{background:var(--surface-2)}
.item.off{opacity:.5}
.item.off .iname{text-decoration:line-through}
.item.have{background:var(--ok-soft);border-color:var(--ok-line)}
.item.have:hover{background:var(--ok-soft)}
.item.locked{background:var(--surface-2);border-color:var(--rule)}
.box{
  width:18px;height:18px;margin-top:2px;border:1.5px solid var(--rule-2);border-radius:4px;
  background:var(--surface);display:grid;place-items:center;flex:none;padding:0;
}
.box[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.box[aria-checked="true"]::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(42deg) translate(-1px,-1px)}
.box[disabled]{background:var(--surface-3);border-style:dashed;cursor:not-allowed}
.iname{font-weight:500;letter-spacing:-.004em}
.ialias{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.imeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.need{
  border:1px solid var(--rule-2);background:var(--surface);border-radius:5px;
  font-size:11.5px;padding:2px 6px;color:var(--ink-2);font-family:inherit;
}
.foot{
  position:sticky;bottom:0;margin-top:16px;background:var(--surface);
  border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow-2);
}
.counts{display:flex;gap:18px;flex-wrap:wrap}
.counts b{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:500;display:block;line-height:1.2}
.counts span{font-size:11.5px;color:var(--ink-3)}

/* ---------- chase board ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.filters .toggle{padding:6px 12px}
.filters .toggle b{font-family:"IBM Plex Mono",monospace;font-weight:500;opacity:.75;margin-left:3px}
.brow{border-bottom:1px solid var(--rule);padding:13px 16px}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--surface-2)}
.bmain{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.bname{font-weight:500;letter-spacing:-.004em}
.bsub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:9px 0 7px;max-width:340px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bmiss{font-size:12.5px;color:var(--ink-2)}
.bmiss b{font-weight:500;color:var(--ink)}
.bacts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.drawer{border-top:1px dashed var(--rule-2);margin-top:12px;padding-top:12px;display:grid;gap:7px}
.ditem{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 9px;background:var(--surface-2);border-radius:6px;font-size:13px}
.empty{text-align:center;padding:46px 20px;color:var(--ink-2)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}

/* ---------- client page ---------- */
.split{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.phone{
  width:390px;max-width:100%;border:10px solid #20282B;border-radius:32px;background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow-2);
}
.phead{background:var(--surface-2);border-bottom:1px solid var(--rule);padding:13px 15px}
.pbody{height:600px;overflow-y:auto;padding:15px}
.firmline{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;flex:none;font-size:13px}
.pbar{height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:11px 0 6px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.ccard{border:1px solid var(--rule);border-radius:9px;padding:12px;margin-bottom:9px;background:var(--surface)}
.ccard.done{background:var(--ok-soft);border-color:var(--ok-line)}
.ccard.answered{background:var(--warn-soft);border-color:var(--warn-line)}
.ccard.redo{background:var(--bad-soft);border-color:var(--bad-line)}
.ccard.confused{background:var(--violet-soft);border-color:var(--violet-line)}
.cname{font-weight:500;font-size:13.5px}
.chint{color:var(--ink-3);font-size:12px;margin-top:2px}
.cbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.cbtn{flex:1;min-width:120px;justify-content:center;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:9px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.cbtn:hover{background:var(--accent);color:var(--accent-ink)}
.cbtn.plain{border-color:var(--rule-2);background:none;color:var(--ink-3);flex:0 0 auto;min-width:0;font-weight:400;font-size:12.5px;padding:9px 11px}
.cbtn.plain:hover{background:var(--surface-2);color:var(--ink)}
.parts{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.part{border:1px solid var(--rule-2);border-radius:5px;padding:2px 8px;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.part.on{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pfoot{border-top:1px solid var(--rule);padding:12px 15px;background:var(--surface-2)}
.gate{width:100%;justify-content:center;padding:12px;border-radius:8px;font-weight:500;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.gate.live{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gate:hover{filter:brightness(1.06)}
.statebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mini{border:1px solid var(--rule);border-left:3px solid var(--ink-3);border-radius:7px;padding:11px 13px;background:var(--surface-2)}
.mini.blocked{border-left-color:var(--bad)}
.mini.clear{border-left-color:var(--ok)}

/* ---------- overlays ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.toast{
  background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 15px;font-size:13px;
  box-shadow:var(--shadow-2);display:flex;align-items:center;gap:13px;max-width:min(92vw,520px);
}
.toast button{background:none;border:0;color:var(--accent);font-weight:500;text-decoration:underline;padding:0}
#modal{position:fixed;inset:0;background:rgba(12,18,16,.5);display:grid;place-items:center;padding:20px;z-index:70}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:13px;box-shadow:var(--shadow-2);max-width:520px;width:100%;max-height:86vh;overflow:auto}
.sheet header{padding:15px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .body{padding:18px}
.sheet footer{padding:13px 18px;border-top:1px solid var(--rule);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 13px 13px}
.wa{background:#E7F0E4;border:1px solid #C6D9C0;border-radius:9px;padding:13px;color:#14261B;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--rule-2);background:var(--surface);border-radius:9px;padding:13px;margin-bottom:9px}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-weight:500}
.opt span{font-size:12.5px;color:var(--ink-3)}
.opt.friendly{border-color:var(--violet-line);background:var(--violet-soft)}
.opt.friendly b{color:var(--violet)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:6px 0;border-bottom:1px solid var(--rule)}
.tbl td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace}
.tbl tr:last-child td{border-bottom:0}

/* ---------- search + clients ---------- */
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--rule-2);background:var(--surface-2);
  border-radius:7px;padding:7px 11px;font:inherit;font-size:13px;color:var(--ink);
}
.search::placeholder{color:var(--ink-3)}
.search:focus{background:var(--surface);border-color:var(--accent);outline:none}
.sresults{
  position:absolute;top:100%;left:0;right:0;margin-top:5px;background:var(--surface);
  border:1px solid var(--rule-2);border-radius:8px;box-shadow:var(--shadow-2);z-index:50;overflow:hidden;
}
.sbox{position:relative;flex:1;max-width:340px;display:flex}
.sresults button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--rule)}
.sresults button:last-child{border-bottom:0}
.sresults button:hover{background:var(--accent-soft)}
.sresults .m{font-size:12px;color:var(--ink-3);margin-top:1px}
.ctable{width:100%;border-collapse:collapse}
.ctable th{
  text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--rule);
}
.ctable td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.ctable tr:last-child td{border-bottom:0}
.ctable tbody tr{cursor:pointer}
.ctable tbody tr:hover{background:var(--surface-2)}
.ctable .nm{font-weight:500}
.ctable .sm2{font-size:12px;color:var(--ink-3);margin-top:1px}
.ids{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);line-height:1.6}
.live{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.none{color:var(--ink-3);font-size:12.5px}
.back{border:0;background:none;color:var(--accent);padding:0;font-size:13px;font-weight:500}
.back:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500}
.person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;background:var(--surface-2);border-radius:7px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:7px 0 14px}
.tile{
  border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;padding:11px 12px;text-align:left;
}
.tile:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.tile b{display:block;font-weight:500;font-size:13px;letter-spacing:-.004em}
.tile span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;font-family:"IBM Plex Mono",monospace}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tile[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.tile[disabled]{opacity:.55;border-style:dashed;cursor:not-allowed}
.grouplbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:12px 0 0}
.prov{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.prov b{color:var(--ink-2);font-weight:500}

/* ---------- demo-only controls, never part of the product ---------- */
.demobar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px dashed var(--rule-2);border-radius:8px;padding:8px 11px;background:var(--surface-2);
}
.demobar .tag{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
  border:1px solid var(--rule-2);border-radius:4px;padding:2px 6px;background:var(--surface);flex:none;
}
.demobar .lbl{font-size:12.5px;color:var(--ink-3);flex:none}
.demobar .opts{display:flex;gap:4px;flex-wrap:wrap}
.demobar button{
  border:1px solid transparent;background:none;border-radius:5px;padding:4px 9px;
  font-size:12.5px;color:var(--ink-2);
}
.demobar button:hover{background:var(--surface-3);color:var(--ink)}
.demobar button[aria-pressed="true"]{background:var(--surface);border-color:var(--rule-2);color:var(--ink);font-weight:500}
.tickhint{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}
</style>

<header class="top">
  <div class="brand">
    <b>Chaser</b>
    <span>Example &amp; Co, Chartered Accountants</span>
  </div>
  <div class="sbox">
    <input id="q" class="search" placeholder="Find a client &mdash; name, PAN, GSTIN, phone" autocomplete="off" oninput="search(this.value)" onkeydown="if(event.key==='Escape'){this.value='';search('')}">
    <div id="sres"></div>
  </div>
  <div class="note">Demo &middot; fictional firm and clients</div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-clients" aria-selected="false" onclick="go('clients')">Clients<small>everyone we act for</small></button>
  <button class="tab" role="tab" id="t-list"  aria-selected="true"  onclick="go('list')">Document checklist<small>pick what to ask for</small></button>
  <button class="tab" role="tab" id="t-board" aria-selected="false" onclick="go('board')">Chase board<small>who hasn't sent</small></button>
  <button class="tab" role="tab" id="t-client" aria-selected="false" onclick="go('client')">Client's page<small>upload &amp; the gate</small></button>
</nav>

<main>
  <section class="panel" id="p-clients" hidden></section>
  <section class="panel" id="p-list"></section>
  <section class="panel" id="p-board" hidden></section>
  <section class="panel" id="p-client" hidden></section>
</main>

<div id="toasts"></div>
<div id="modal" hidden onclick="if(event.target.id==='modal')closeModal()"></div>

<script>
/* =======================================================================
   DATA
   ======================================================================= */
const FIRM = "Example & Co";

let due = "30 September 2026";
let dueDays = 18;

/* --- the checklist for Sharma Textiles, Tax Audit 44AB FY 2025-26 --- */
const SECTIONS = ["Books and financials","Bank and cash","GST and TDS","Form 3CD declarations"];

let items = [

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg, undo){
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${msg}</span>`;
  if(undo){
    const b = document.createElement("button");
    b.textContent = "Undo";
    b.onclick = () => { undo(); el.remove(); };
    el.appendChild(b);
  }
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

function modal(title, body, footer){
  $("#modal").innerHTML =
    `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
       <header><h3>${title}</h3><button class="btn sm" onclick="closeModal()">Close</button></header>
       <div class="body">${body}</div>
       ${footer ? `<footer>${footer}</footer>` : ""}
     </div>`;
  $("#modal").hidden = false;
}
function closeModal(){ $("#modal").hidden = true; }

function go(tab){
  ["clients","list","board","client"].forEach(t => {
    $("#p-" + t).hidden = (t !== tab);

  });
  window.scrollTo({top:0, behavior:"instant"});
}

  const i = items.find(x => x.id === id);

function setNeed(id, v){
  const i = items.find(x => x.id === id);
  const was = i.need; i.need = v;
  drawList();
  toast(`“${esc(i.name)}” is now ${v.toLowerCase()}. ${v === "Required" ? "It blocks Start work." : "It does not block Start work."}`,
        () => { i.need = was; drawList(); });
}

function flip(tid){
  const t = TOGGLES.find(x => x.id === tid);
  t.on = !t.on;
  const hit = items.filter(i => i.tag === tid);
  const before = hit.map(i => i.on);
  hit.forEach(i => i.on = t.on);
  drawList();
  toast(`${t.on ? "+" : "−"}${hit.length} item${hit.length===1?"":"s"} (${esc(t.label.toLowerCase())})`,
        () => { t.on = !t.on; hit.forEach((i,n) => i.on = before[n]); drawList(); });
}

const STATES = [
  {id:"empty",    label:"Just opened the link"},
  {id:"partial",  label:"Halfway through"},
  {id:"answered", label:"Every item answered"},
  {id:"complete", label:"All accepted"},
];

function applyState(s){
  cstate = s;
  cards.forEach(c => {
    if(s === "empty")    c.st = "pending";
    if(s === "complete") c.st = "done";
  });
  if(s === "partial"){
    const done = ["tb","fin","sales","purch","cash"];
    cards.forEach(c => c.st = done.includes(c.id) ? "done" : (c.id === "gst" ? "redo" : "pending"));
    const b = cards.find(c => c.id === "bank"); b.got = ["Apr","May","Jun","Jul","Sep","Oct","Dec","Jan","Feb","Mar"];
  }
  if(s === "answered"){
    cards.forEach(c => c.st = "done");
    cards.find(c => c.id === "stock").st = "promised";
    cards.find(c => c.id === "rpt").st = "na";
    cards.find(c => c.id === "msme").st = "thirdparty";
    cards.find(c => c.id === "tds").st = "confused";
  }
  if(s === "complete"){ const b = cards.find(c => c.id === "bank"); b.got = [...b.parts]; }
  drawClient();
}

function pending(){ return cards.filter(c => c.st === "pending" || c.st === "redo").length; }
function accepted(){ return cards.filter(c => c.st === "done").length; }
function allAnswered(){ return pending() === 0; }
function firmClear(){ return cards.every(c => c.st === "done" || c.st === "na"); }

function cardLook(c){
  if(c.st === "done")       return ["done",      `<span class="chip ok">Done ✓</span>`];
  if(c.st === "redo")       return ["redo",      `<span class="chip bad">Please send again</span>`];
  if(c.st === "promised")   return ["answered",  `<span class="chip warn">You said Tuesday</span>`];
  if(c.st === "na")         return ["answered",  `<span class="chip warn">Doesn't apply, Priya is checking</span>`];
  if(c.st === "thirdparty") return ["answered",  `<span class="chip warn">Your bank has it</span>`];
  if(c.st === "confused")   return ["confused",  `<span class="chip violet">Priya will call you today</span>`];
  return ["", `<span class="chip">Not sent yet</span>`];
}

function upload(id){
  const c = cards.find(x => x.id === id);
  if(c.parts){
    const miss = c.parts.filter(p => !c.got.includes(p));
    if(miss.length){
      c.got.push(miss[0]);
      if(!c.parts.filter(p => !c.got.includes(p)).length) c.st = "done";
      drawClient();
      toast(`${miss[0]} statement uploaded. ${c.parts.length - c.got.length} month${c.parts.length-c.got.length===1?"":"s"} left.`);
      return;
    }
  }
  const was = c.st;
  c.st = "done"; drawClient();
  toast(`“${esc(c.name)}” uploaded and saved.`, () => { c.st = was; drawClient(); });
}

function hatch(id){
  const c = cards.find(x => x.id === id);
  modal("I don't have this",
    `<p class="sub" style="margin-bottom:13px">${esc(c.name)}</p>
     <button class="opt" onclick="answer('${id}','promised','You said you would send it')"><b>I don't have it yet, I'll get it</b><span>Pick a day. Priya sees the promise and stops chasing until then.</span></button>

     <button class="opt friendly" onclick="answer('${id}','confused','Priya has been told, she will call today')"><b>I don't understand what this is</b><span>Priya is told right now and will call you today.</span></button>
     <button class="opt" onclick="answer('${id}','thirdparty','Noted, your bank has it')"><b>Someone else has it</b><span>My bank, my office, my broker. Tell us who and we'll ask them.</span></button>`);
}
function answer(id, st, msg){
  const c = cards.find(x => x.id === id);
  const was = c.st;
  c.st = st; closeModal(); drawClient();
  toast(msg + ".", () => { c.st = was; drawClient(); });
}

function gateTap(){
  if(allAnswered()){
    toast("Priya has been told you're done. She'll call if anything else comes up.");
    return;
  }
  const first = cards.find(c => c.st === "pending" || c.st === "redo");

  el.animate([{boxShadow:"0 0 0 0 rgba(21,69,110,.55)"},{boxShadow:"0 0 0 9px rgba(21,69,110,0)"}], {duration:900, iterations:2});
  toast(`${pending()} still open. Starting with “${esc(first.name)}”.`);
}

      </div>
    </div>

    <div class="card pad">
      <div class="eyebrow" style="margin-bottom:10px">Running now</div>
      ${c.live.length ? c.live.map(e => `<div class="person" style="margin-bottom:7px">
          <div><b style="font-weight:500">${esc(e.t)}</b><div class="sm2">${e.d} of ${e.n} documents in</div></div>
          <span class="inline"><button class="btn sm" onclick="go('list')">Open checklist</button><button class="btn sm" onclick="go('board')">Open on the board</button></span>
        </div>`).join("")
      : `<p class="sub">Nothing running. This is the client the chase board cannot show you, because the board only lists engagements that exist.</p>`}
    </div>

    ${c.onfile.length ? `<div class="card pad">
      <div class="eyebrow" style="margin-bottom:8px">Already on file</div>
      ${c.onfile.map(o => `<p class="sub" style="margin-bottom:5px"><span class="chip ok">Have it</span> ${esc(o)}</p>`).join("")}
      <p class="sub" style="font-size:12.5px;margin-top:8px">Answers &ldquo;have we already got this?&rdquo; without opening an engagement. It is what stops the same document being asked for three times.</p>
    </div>` : ""}
  </div>`;
}

/* =======================================================================
   START AN ENGAGEMENT  —  the tiles
   ======================================================================= */
let typeChosen  = true;   // false = the picker owns the screen
let engagementSent = false;   // true once the client has the link
let pickerOpen  = false;

function startFor(clientId){
  const c = clientId ? CLIENTS.find(x => x.id === clientId) : null;
  typeChosen = false; pickerOpen = false; engagementSent = false;
  openClientId = null;
  drawList(); go("list");
  if(c) toast(`Starting something for ${esc(c.name)}. Pick what you are doing.`);
}

function openPicker(){
  if(engagementSent){
    modal("The client already has this link",
      `<p class="sub">You cannot switch this engagement to a different type now. Sharma-ji has the link and two documents are already in.</p>
       <p class="sub" style="margin-top:11px">Cancel this engagement and start a new one instead. Anything already received stays on file, and the new checklist will show it as already satisfied rather than asking again.</p>`,
      `<button class="btn" onclick="closeModal()">Leave it as it is</button>
       <button class="btn primary" onclick="closeModal();startFor()">Cancel and start again</button>`);
    return;
  }
  pickerOpen = true; drawList();
}

function chooseType(id){
  const t = ENGAGEMENT_TYPES.find(x => x.id === id);
  const wasType = currentType, wasChosen = typeChosen, wasToggles = TOGGLES;
  currentType = id;
  TOGGLES = t.toggles.map(x => ({...x}));
  typeChosen = true; pickerOpen = false;
  drawList();
  toast(`${esc(t.name)} — ${t.items} items pre-ticked. Nothing sent to the client yet.`,
        () => { currentType = wasType; TOGGLES = wasToggles; typeChosen = wasChosen; drawList(); });
}

const LSTATES = [
  {id:"new",     label:"Nothing started yet"},
  {id:"choosing",label:"Changing the type"},
  {id:"working", label:"Working on the list"},
  {id:"sent",    label:"Request already sent"},
];
let lstate = "working";
function setLState(id){
  lstate = id;
  typeChosen     = id !== "new";
  pickerOpen     = id === "choosing";
  engagementSent = id === "sent";
  drawList();
}
function lstateBar(){
  return `<div class="demobar">
    <span class="tag">Demo</span>
    <span class="lbl">See this screen at a different point:</span>
    <span class="opts">${LSTATES.map(x =>
      `<button aria-pressed="${lstate===x.id}" onclick="setLState('${x.id}')">${esc(x.label)}</button>`
    ).join("")}</span>
  </div>`;
}

function pickerHTML(switching){
  const groups = ["Audit","Compliance","Certification"];
  return `<div class="card pad">
    <div class="row-between" style="margin-bottom:4px">
      <div>
        <h3>${switching ? "Change what this engagement is" : "What are you doing for Sharma Textiles?"}</h3>
        <p class="sub" style="margin-top:3px">${switching
          ? "Nothing has been sent yet, so this is free. The list and the questions underneath both change."
          : "Pick one. The document list writes itself, and you edit it underneath."}</p>
      </div>
      ${switching ? `<button class="btn sm" onclick="pickerOpen=false;drawList()">Keep ${esc(ET().name)}</button>` : ""}
    </div>
    ${groups.map(g => `<p class="grouplbl">${g}</p>
      <div class="tiles">${ENGAGEMENT_TYPES.filter(t => t.group===g).map(t =>
        t.disabled
          ? `<button class="tile" disabled><b>${esc(t.name)}</b><span>${esc(t.disabled)}</span></button>`
          : `<button class="tile" aria-pressed="${typeChosen && currentType===t.id}" onclick="chooseType('${t.id}')">
               <b>${esc(t.name)}</b><span>${typeChosen && currentType===t.id ? "current" : t.items + " items"}</span></button>`
      ).join("")}</div>`).join("")}
    <p class="sub" style="font-size:12.5px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)">
      <b>No internal audit here, deliberately.</b> Its scope is set per engagement by the board, and the real requests only exist once you have picked a sample. There is nothing to pre-tick, so it needs a running request log rather than a checklist.</p>
  </div>`;
}

/* type-ahead over the whole book of business */
function search(q){
  const box = $("#sres");
  q = q.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML = ""; return; }
  const hits = CLIENTS.filter(c =>
    (c.name+" "+c.pan+" "+c.gstin+" "+c.people.map(p=>p.n+" "+p.p).join(" ")).toLowerCase().includes(q)
  ).slice(0,8);
  box.innerHTML = hits.length
    ? `<div class="sresults">${hits.map(c => `<button onclick="openClient(${c.id});document.getElementById('q').value='';search('')">
         <b style="font-weight:500">${esc(c.name)}</b><div class="m">${esc(c.con)} &middot; ${esc(c.pan)} &middot; ${c.live.length?c.live.length+" live":"nothing started"}</div></button>`).join("")}</div>`
    : `<div class="sresults"><button onclick="document.getElementById('q').value='';search('')"><b style="font-weight:500">No client matches &ldquo;${esc(q)}&rdquo;</b><div class="m">Try a PAN, a GSTIN or a phone number</div></button></div>`;
}
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement.id !== "q"){ e.preventDefault(); $("#q").focus(); }
});


drawClients(); drawList(); drawBoard(); applyState("partial");
</script>
